plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.molitao.app'
    compileSdk = 35

    defaultConfig {
        applicationId = "com.molitao.app"
        minSdk = 24
        targetSdk = 33
        versionCode = 100
        versionName = "1.0.0"

        manifestPlaceholders = [
            "apk.applicationId": applicationId,
            "JPUSH_PKGNAME": applicationId,
            "JPUSH_APPKEY": "4e91398522bb1286f6452efb",
            "JPUSH_CHANNEL": "developer-default",
            "plus.unipush.appid": "",
            "plus.unipush.appkey": "",
            "plus.unipush.appsecret": "",
            "GETUI_APPID": "",
            "GY_APP_ID": "",
            "GT_INSTALL_CHANNEL": "",
            "plus.paypal.returnUrl": "",
            "plus.google_map.APIKey_android": ""
        ]

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        debug {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        release {
            storeFile = file("molitao-release.keystore")
            storePassword = "molitao123"
            keyAlias = "molitao"
            keyPassword = "molitao123"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles += getDefaultProguardFile('proguard-android-optimize.txt')
            proguardFiles += file('proguard-rules.pro')
        }
        debug {
            signingConfig = signingConfigs.debug
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    // UniApp 离线打包必需配置
    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // UniApp 必需 AndroidX 依赖
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.webkit:webkit:1.5.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core:1.6.0'
    implementation "androidx.fragment:fragment:1.1.0"

    // UniApp 必需第三方库
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.github.bumptech.glide:glide:4.9.0'

    // Fresco for image loading (required by UniApp SDK)
    implementation "com.facebook.fresco:fresco:3.4.0"
    implementation "com.facebook.fresco:middleware:3.4.0"
    implementation "com.facebook.fresco:animated-gif:3.4.0"
    implementation "com.facebook.fresco:webpsupport:3.4.0"
    implementation "com.facebook.fresco:animated-webp:3.4.0"

    // JPush
    implementation 'cn.jiguang.sdk:jpush:5.0.0'
    implementation 'cn.jiguang.sdk:jcore:3.6.0'

    // 微信支付/分享
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android-without-mta:6.7.9'
}
