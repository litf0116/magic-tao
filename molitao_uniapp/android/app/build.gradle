plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.molitao.app'
    compileSdk = 35

    defaultConfig {
        applicationId = "com.molitao.app"
        minSdk = 24
        targetSdk = 35
        versionCode = 100
        versionName = "1.0.0"

        manifestPlaceholders = [
            "apk.applicationId": applicationId,
            "JPUSH_PKGNAME": applicationId,
            "JPUSH_APPKEY": "4e91398522bb1286f6452efb",
            "JPUSH_CHANNEL": "developer-default",
            "plus.unipush.appid": "",
            "plus.unipush.appkey": "",
            "plus.unipush.appsecret": ""
        ]

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        debug {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        release {
            storeFile = file("molitao-release.keystore")
            storePassword = "molitao123"
            keyAlias = "molitao"
            keyPassword = "molitao123"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles += getDefaultProguardFile('proguard-android-optimize.txt')
            proguardFiles += file('proguard-rules.pro')
        }
        debug {
            signingConfig = signingConfigs.debug
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: '.')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'cn.jiguang.sdk:jpush:5.0.0'
    implementation 'cn.jiguang.sdk:jcore:3.6.0'

    // DCloud uni-app SDK - 使用本地 AAR 文件
    implementation files('libs/uniapp-v8-release.aar')
    implementation files('libs/lib.5plus.base-release.aar')
    implementation 'com.alibaba:fastjson:1.2.83'
}