    html {
      height: 100%
    }

      margin: 0;

    .center {

      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;

      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;

    }

    }

  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {

<body>
  <!-- Loading indicator -->
  <div id="loading">
    <style>
      body {
        margin: 0;
        background: #FAF1F0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #loading {
        text-align: center;
        color: #f4835a;
      }
      #loading::before {
        content: '';
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 3px solid rgba(244, 131, 90, 0.3);
        border-radius: 50%;
        border-top-color: #f4835a;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div>正在加载魔力淘...</div>
  </div>

  <script>
    // Remove loading indicator when Flutter app is ready
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.display = 'none';
        }
      }, 100);
    });
  </script>

  <script src="flutter_bootstrap.js" async=""></script>
