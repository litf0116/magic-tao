name: molitao_app
description: "魔力淘 - 在线拍卖交易平台"
publish_to: 'none'

version: 1.5.4+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 网络请求
  dio: ^5.7.0

  # 路由
  go_router: ^14.8.1

  # 底部导航栏
  persistent_bottom_nav_bar_v2: ^6.3.2

  # 本地存储
  shared_preferences: ^2.5.3

  # UI 组件
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # 图片选择
  image_picker: ^1.1.2

  # 工具库
  intl: ^0.20.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # WebSocket
  web_socket_channel: ^3.0.2

  # 微信登录/支付
  fluwx: ^5.7.5

  # 极光推送
  jpush_flutter: ^3.4.4

  # 权限管理
  permission_handler: ^11.3.1

  # 音频播放
  audioplayers: ^6.1.0

  # HTML 渲染
  flutter_html: ^3.0.0-beta.2

  # URL 深度链接
  url_launcher: ^6.3.1

  # 加密
  crypto: ^3.0.6
  package_info_plus: ^9.0.1

  # 二维码扫描
  mobile_scanner: ^6.0.2

  # 文件系统访问
  path_provider: ^2.1.4

  # 设备信息
  device_info_plus: ^11.2.0

  # 网络连接状态
  connectivity_plus: ^6.1.0

  # 应用生命周期
  flutter_lifecycle_detector: ^0.0.8

  # 国际化
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration Test（基础 UI 测试）
  integration_test:
    sdk: flutter

  # Patrol（完整 E2E 测试）
  patrol: ^3.20.0

  # 代码质量检查
  flutter_lints: ^5.0.0

  # 代码生成
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  riverpod_generator: ^2.6.3

  # 应用图标生成
  flutter_launcher_icons: ^0.14.3

  # 启动画面生成
  flutter_native_splash: ^2.4.3

  # 自定义lint规则
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.1

# 应用图标配置
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#f4835a"
  adaptive_icon_foreground: "assets/images/app-icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FAF1F0"
  color_dark: "#FAF1F0"
  ios: true
  android: true
  web: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tab/
    - assets/images/local/
    - assets/sounds/
