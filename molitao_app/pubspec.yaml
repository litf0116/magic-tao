name: molitao_app
description: "魔力淘 - 在线拍卖交易平台"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 网络请求
  dio: ^5.7.0

  # 路由
  go_router: ^14.8.1

  # 本地存储
  shared_preferences: ^2.5.3

  # UI 组件
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # 工具库
  intl: ^0.19.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # WebSocket
  web_socket_channel: ^3.0.2

  # 微信登录/支付 (Phase 3)
  # fluwx: ^5.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tab/
