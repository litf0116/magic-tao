# Gitee Go CI/CD 配置
# 使用腾讯云 TCR 容器镜像服务

displayName: 后端构建部署流水线
runAfter:
  initialized:
    branch:
      only:
        - main
        - master
        - develop-2

giteeCIRef: $GIT_REF_NAME
giteeDefaultBranch: develop-2

stages:
  - stage:
      name: 构建 Docker 镜像
      triggerMode: 自动触发
      refModes:
        - branch
        - tag
      DAG:
        jobs:
          - job:
              name: build-and-push-image
              poolType: 标准管理节点
              steps:
                - step:
                    name: 检出代码
                    type: checkout
                    version: v2.3.8

                - step:
                    name: 登录镜像仓库
                    type: script
                    version: v1.0.0
                    script: |
                      echo ${{ secrets.TENCENT_CCR_PASSWORD }} | docker login ccr.ccs.tencentyun.com -u ${{ secrets.TENCENT_CCR_USERNAME }} --password-stdin
                      echo "腾讯云镜像仓库登录成功"

                - step:
                    name: 构建并推送镜像
                    type: script
                    version: v1.0.0
                    script: |
                      cd backend
                      
                      # 确定镜像版本
                      IMAGE_TAG="${GITEE_BUILD_INDEX:-latest}"
                      if [ "${{ GITHUB_GIT_REF_NAME:-}}" != "" ]; then
                        IMAGE_TAG="${{ GITHUB_GIT_REF_NAME:-}}"
                      fi
                      
                      FULL_IMAGE="ccr.ccs.tencentyun.com/${{ secrets.TENCENT_CCR_NAMESPACE }}/api:${IMAGE_TAG}"
                      
                      echo "开始构建镜像: ${FULL_IMAGE}"
                      
                      # 构建 Docker 镜像
                      docker build \
                        --no-cache \
                        -f ./src/TtWork.Project.Web.Host/Dockerfile \
                        --build-arg HTTP_PROXY=http://192.168.3.50:10809 \
                        --build-arg HTTPS_PROXY=http://192.168.3.50:10809 \
                        -t ${FULL_IMAGE} .
                      
                      # 推送镜像
                      docker push ${FULL_IMAGE}
                      echo "镜像推送完成: ${FULL_IMAGE}"
                      
                      # 如果不是 latest，同时推送 latest
                      if [ "${IMAGE_TAG}" != "latest" ]; then
                        docker tag ${FULL_IMAGE} "ccr.ccs.tencentyun.com/${{ secrets.TENCENT_CCR_NAMESPACE }}/api:latest"
                        docker push "ccr.ccs.tencentyun.com/${{ secrets.TENCENT_CCR_NAMESPACE }}/api:latest"
                        echo "同时推送了 latest 标签"
                      fi

  - stage:
      name: 部署到生产环境
      triggerMode: 自动触发
      refModes:
        - branch
        - tag
      DAG:
        jobs:
          - job:
              name: deploy-production
              poolType: 标准管理节点
              needs:
                - build-and-push-image
              steps:
                - step:
                    name: 部署服务
                    type: sshcommand
                    version: v1.0.6
                    params:
                      host: 8.130.178.251
                      port: 22
                      user: root
                      password: ${{ secrets.SERVER_PASSWORD }}
                      connectTimeout: 30
                      commandTimeout: 300
                      scripts: |
                        set -e
                        echo "=========================================="
                        echo "开始部署"
                        echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
                        echo "分支: ${GITEE_GIT_BRANCH}"
                        echo "Commit: ${GITEE_GIT_COMMIT:0:8}"
                        echo "构建号: ${GITEE_BUILD_INDEX}"
                        echo "=========================================="

                        # 登录镜像仓库
                        docker login ccr.ccs.tencentyun.com -u ${{ secrets.TENCENT_CCR_USERNAME }} -p ${{ secrets.TENCENT_CCR_PASSWORD }}

                        # 拉取最新镜像
                        docker pull ccr.ccs.tencentyun.com/${{ secrets.TENCENT_CCR_NAMESPACE }}/api:latest

                        # 停止旧容器
                        docker stop api 2>/dev/null && echo "旧容器已停止" || echo "无运行中的容器"
                        docker rm api 2>/dev/null && echo "旧容器已删除" || echo "容器无需删除"

                        # 启动新容器
                        docker run -d \
                          --network=app \
                          --restart=always \
                          -v /www/certs:/app/cert \
                          -v /www/wwwroot/www.molitao.top/wwwroot:/app/wwwroot \
                          -v /data2/logs:/app/logs \
                          -p 5000:5000 \
                          -e TZ='Asia/Shanghai' \
                          --name api \
                          ccr.ccs.tencentyun.com/${{ secrets.TENCENT_CCR_NAMESPACE }}/api:latest

                        # 检查容器状态
                        sleep 5
                        if docker ps | grep -q api; then
                          echo "容器启动成功!"
                          docker logs api --tail 5
                        else
                          echo "容器启动失败!"
                          docker logs api
                          exit 1
                        fi

                        # 清理旧镜像
                        docker image prune -f 2>/dev/null || true

                        echo "=========================================="
                        echo "部署完成!"
                        echo "=========================================="

                - step:
                    name: 发送飞书通知
                    type: script
                    version: v1.0.0
                    script: |
                      BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S')
                      BUILD_STATUS="✅ 成功"
                      
                      # 发送飞书富文本消息
                      curl -X POST \
                        -H "Content-Type: application/json" \
                        -d "{
                          \"msg_type\": \"interactive\",
                          \"card\": {
                            \"header\": {
                              \"title\": {
                                \"tag\": \"plain_text\",
                                \"content\": \"🚀 部署通知\"
                              },
                              \"template\": \"green\"
                            },
                            \"elements\": [
                              {
                                \"tag\": \"div\",
                                \"text\": {
                                  \"tag\": \"lark_md\",
                                  \"content\": \"**项目**: molitao 后端服务\"
                                }
                              },
                              {
                                \"tag\": \"div\",
                                \"text\": {
                                  \"tag\": \"lark_md\",
                                  \"content\": \"**状态**: ${BUILD_STATUS}\"
                                }
                              },
                              {
                                \"tag\": \"div\",
                                \"text\": {
                                  \"tag\": \"lark_md\",
                                  \"content\": \"**分支**: ${GITEE_GIT_BRANCH}\"
                                }
                              },
                              {
                                \"tag\": \"div\",
                                \"text\": {
                                  \"tag\": \"lark_md\",
                                  \"content\": \"**Commit**: ${GITEE_GIT_COMMIT:0:8}\"
                                }
                              },
                              {
                                \"tag\": \"div\",
                                \"text\": {
                                  \"tag\": \"lark_md\",
                                  \"content\": \"**构建号**: ${GITEE_BUILD_INDEX}\"
                                }
                              },
                              {
                                \"tag\": \"div\",
                                \"text\": {
                                  \"tag\": \"lark_md\",
                                  \"content\": \"**时间**: ${BUILD_TIME}\"
                                }
                              }
                            ]
                          }
                        }" \
                        'https://open.feishu.cn/open-apis/bot/v2/hook/4ad95bd6-6014-4b17-84d0-9cda877f0949'
                      echo ""
                      echo "飞书通知已发送"

env:
  DOCKER_BUILDX_DRIVER: docker-container
