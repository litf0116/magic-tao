name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

stages:
  # Stage 1: Backend (.NET 8 + ABP Framework)
  - name: Backend Build & Test
    jobs:
      - name: backend-build
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          
          - name: Setup .NET 8
            uses: actions/setup-dotnet@v4
            with:
              dotnet-version: '8.0.x'
          
          - name: Restore dependencies
            run: dotnet restore backend/Molitao.sln
          
          - name: Build
            run: dotnet build backend/Molitao.sln --configuration Release --no-restore
          
          - name: Run tests
            run: dotnet test backend/Molitao.sln --no-build --verbosity normal

  # Stage 2: PC Web (Vue 3 + TypeScript)
  - name: PC Web Build & Lint
    jobs:
      - name: pc-build
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: '20'
              cache: 'npm'
              cache-dependency-path: pc/package-lock.json
          
          - name: Install dependencies
            working-directory: ./pc
            run: npm ci
          
          - name: Run lint check
            working-directory: ./pc
            run: npm run lint:fix
            continue-on-error: true
          
          - name: Build production
            working-directory: ./pc
            run: npm run build:prod
          
          - name: Upload build artifacts
            uses: actions/upload-artifact@v4
            with:
              name: pc-dist
              path: pc/dist/
              retention-days: 7

  # Stage 3: UniApp (小程序)
  - name: UniApp Build & Check
    jobs:
      - name: uniapp-build
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: '20'
              cache: 'npm'
              cache-dependency-path: molitao_uniapp/package-lock.json
          
          - name: Install dependencies
            working-directory: ./molitao_uniapp
            run: npm ci
          
          - name: Run type check
            working-directory: ./molitao_uniapp
            run: npm run type-check
          
          - name: Run lint check
            working-directory: ./molitao_uniapp
            run: npm run lint:fix
            continue-on-error: true
          
          - name: Build WeChat Mini Program
            working-directory: ./molitao_uniapp
            run: npm run build:mp-weixin
          
          - name: Upload build artifacts
            uses: actions/upload-artifact@v4
            with:
              name: uniapp-mp-weixin
              path: molitao_uniapp/dist/build/mp-weixin/
              retention-days: 7

