# Nginx 配置 - 测试服务 beta.molitao.top (简化版)

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name beta.molitao.top www.beta.molitao.top;
    return 301 https://$server_name$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl;
    server_name beta.molitao.top www.beta.molitao.top;

    # SSL 证书
    ssl_certificate /etc/nginx/ssl/beta.molitao.top/beta.molitao.top.pem;
    ssl_certificate_key /etc/nginx/ssl/beta.molitao.top/beta.molitao.top.key;

    # SSL 基础配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 日志
    access_log /var/log/nginx/beta.molitao.top-access.log;
    error_log /var/log/nginx/beta.molitao.top-error.log;

    # 客户端上传大小
    client_max_body_size 100M;

    # API 代理
    location / {
        proxy_pass http://127.0.0.1:12580;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态文件
    location /uploads/ {
        alias /Users/mac/workspace/magic-tao/backend/src/TtWork.Project.Web.Host/wwwroot/uploads/;
        expires 30d;
    }
}

# WebSocket 连接升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
