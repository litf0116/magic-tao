stages:
  - build
  - deploy
  - test

variables:
  IMAGE_NAME: gitlab.somall.top:8090/molitao/api
  BUILD_DATE: $(date '+%Y%m%d-%H%M%S')

build_image:
  stage: build
  when: manual
  allow_failure: false
  only:
    - main
  script:
    - cd backend
    - echo "构建时间: $(date '+%Y-%m-%d %H:%M:%S')"
    - echo "构建版本: ${BUILD_DATE}"
    # 使用 --no-cache 确保每次都重新构建所有层
    - docker build --no-cache -f ./src/TtWork.Project.Web.Host/Dockerfile --network=host --build-arg HTTP_PROXY=http://192.168.3.50:10809 --build-arg HTTPS_PROXY=http://192.168.3.50:10809 -t ${IMAGE_NAME}:${BUILD_DATE} -t ${IMAGE_NAME}:latest .
    - docker push ${IMAGE_NAME}:${BUILD_DATE}
    - docker push ${IMAGE_NAME}:latest
    - echo "镜像构建完成: ${IMAGE_NAME}:${BUILD_DATE}"
    - docker push gitlab.somall.top:8090/molitao/api:latest

deploys:
  stage: deploy
  needs:
    - build_image
  allow_failure: false
  script:
    - ./plink.exe -ssh root@8.130.178.251 -pw "lZ9C&NC3" -batch "docker pull gitlab.somall.top:8090/molitao/api:latest;docker stop api ; docker rm api; docker run -d --network=app --restart=always -v /www/certs:/app/cert -v /www/wwwroot/www.molitao.top/wwwroot:/app/wwwroot -p 5000:5000  -e TZ='Asia/Shanghai' --name api gitlab.somall.top:8090/molitao/api:latest"

tests:
  stage: test
  needs:
    - deploys
  script:
    - $hash = @{"msgtype"="text";"text"= @{ "content"= "[molitao] gitlab finish";}}
    - curl -uri https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=e3c308bf-df87-46f4-95b8-2920ef050987 -Method POST -Headers @{"Content-Type"="application/json"} -Body ($hash | convertto-json)
