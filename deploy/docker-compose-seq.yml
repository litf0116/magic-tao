version: '3.8'

services:
  seq:
    image: datalust/seq
    container_name: seq
    restart: unless-stopped
    ports:
      - "5341:80"
    volumes:
      - ~/seq/data:/data
    environment:
      - ACCEPT_EULA=Y
      # 密码 'www_molitao_top' 的hash值，由以下命令生成：
      # echo 'www_molitao_top' | docker run --rm -i datalust/seq config hash
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=QC+oACevxIsRHKNUObp3SNZLpUc/mTyIKwRB5D/rOn3sAB70fP/Sw3dcewNKIiFUBQM6Kzmocy8iY98RoH5OWTxoif3441EtFqcvM767T4A/
    networks:
      - app

networks:
  app:
    external: true 