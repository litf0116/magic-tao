<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>魔力淘 App 下载</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f0eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
            color: #333;
        }

        .page {
            width: 100%;
            max-width: 420px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #833a00;
        }

        .header p {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }

        /* App Card */
        .app-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px 24px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(131, 58, 0, 0.08);
            margin-bottom: 16px;
        }

        .app-icon {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            border: 2px solid #ae6f4d;
            margin-bottom: 16px;
            object-fit: cover;
        }

        .app-name {
            font-size: 22px;
            font-weight: 600;
            color: #833a00;
            margin-bottom: 8px;
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            background: #fff2e8;
            border: 1px solid #ae6f4d;
            border-radius: 20px;
            font-size: 13px;
        }

        .version-badge .label {
            color: #ae6f4d;
        }

        .version-badge .value {
            color: #833a00;
            font-weight: 500;
        }

        /* Loading / Error */
        .loading-state, .error-state {
            padding: 40px 0;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        .error-state {
            color: #e74c3c;
        }

        /* Description */
        .description-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(131, 58, 0, 0.08);
            margin-bottom: 16px;
        }

        .description-card h3 {
            font-size: 15px;
            font-weight: 600;
            color: #833a00;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0e8e0;
        }

        .description-content {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .description-placeholder {
            font-size: 13px;
            color: #bbb;
        }

        /* Download Button */
        .download-section {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(131, 58, 0, 0.08);
            margin-bottom: 16px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px 24px;
            background: #833a00;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .download-btn:hover, .download-btn:active {
            background: #6a2e00;
        }

        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .download-btn .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .file-info {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
            font-size: 12px;
            color: #999;
        }

        .file-info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Tips */
        .tips-card {
            background: #fff2e8;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .tips-card h4 {
            font-size: 13px;
            font-weight: 600;
            color: #833a00;
            margin-bottom: 8px;
        }

        .tips-card p {
            font-size: 13px;
            color: #ae6f4d;
            line-height: 1.6;
        }

        .tips-card .highlight {
            color: #833a00;
            font-weight: 500;
        }

        /* iOS Download Link */
        .ios-link {
            text-align: center;
            margin-top: 20px;
        }

        .ios-link a {
            font-size: 13px;
            color: #ae6f4d;
            text-decoration: none;
        }

        .ios-link a:hover {
            text-decoration: underline;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.78);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            text-align: center;
            max-width: 280px;
        }

        .toast.show {
            opacity: 1;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px 0 10px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Header -->
        <div class="header">
            <h1>魔力淘 App</h1>
            <p>随时随地，畅享魔力淘</p>
        </div>

        <!-- App Card -->
        <div class="app-card" id="appCard">
            <img src="/favicon.ico" alt="魔力淘" class="app-icon" id="appIcon"
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23833a00%22/><text x=%2250%22 y=%2268%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-size=%2240%22 font-weight=%22bold%22>淘</text></svg>'">
            <div class="app-name">魔力淘</div>
            <div class="version-badge">
                <span class="label">最新版本</span>
                <span class="value" id="versionText">加载中...</span>
            </div>
        </div>

        <!-- Description -->
        <div class="description-card" id="descriptionCard">
            <h3>更新内容</h3>
            <div class="description-content" id="descriptionContent">
                <div class="description-placeholder">正在加载更新信息...</div>
            </div>
        </div>

        <!-- Download -->
        <div class="download-section">
            <button class="download-btn" id="downloadBtn" disabled>
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v4h3.66V9h3.84L12 2z" transform="rotate(180,12,12)"/>
                </svg>
                <span id="downloadBtnText">加载中...</span>
            </button>
            <div class="file-info">
                <span id="fileSizeInfo">文件大小：--</span>
                <span id="versionInfo">版本：--</span>
            </div>
        </div>

        <!-- Tips for WeChat -->
        <div class="tips-card">
            <h4>⚠️ 微信内下载说明</h4>
            <p>
                如点击下载按钮后没有反应，请点击右上角 <span class="highlight">「···」</span>，
                选择 <span class="highlight">「在浏览器中打开」</span> 后再点击下载。
            </p>
        </div>

        <!-- iOS Link -->
        <div class="ios-link">
            <a href="https://www.molitao.top/#/app-download">iPhone 用户点此查看下载方式</a>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- Footer -->
        <div class="footer">魔力淘 &copy; 2026</div>
    </div>

    <script>
        (function() {
            const API_BASE = '/api/services/app/AppRelease/CheckUpdate';

            const $ = function(id) { return document.getElementById(id); };

            const versionText = $('versionText');
            const descriptionContent = $('descriptionContent');
            const downloadBtn = $('downloadBtn');
            const downloadBtnText = $('downloadBtnText');
            const fileSizeInfo = $('fileSizeInfo');
            const versionInfo = $('versionInfo');
            const toast = $('toast');

            let toastTimer = null;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                }, 2500);
            }

            function formatFileSize(bytes) {
                if (!bytes || bytes === 0) return '--';
                if (bytes < 1024 * 1024) {
                    return (bytes / 1024).toFixed(1) + ' KB';
                }
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            }

            function getVersionData() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', API_BASE + '?currentVersionCode=0&platform=android', true);
                xhr.setRequestHeader('Accept', 'application/json');

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            var raw = JSON.parse(xhr.responseText);
                            // Handle ABP wrapper: { __abp: true, success: true, result: {...} }
                            var data = raw && raw.__abp === true ? raw.result : raw;

                            if (data && data.latestVersionName) {
                                renderVersion(data);
                            } else {
                                showError('暂无版本信息');
                            }
                        } catch (e) {
                            showError('数据解析失败');
                        }
                    } else {
                        showError('网络请求失败');
                    }
                };

                xhr.onerror = function() {
                    showError('网络连接失败，请检查网络后重试');
                };

                xhr.send();
            }

            function renderVersion(data) {
                var versionName = data.latestVersionName || '未知';
                var description = data.description || '';
                var downloadUrl = data.downloadUrl || '';
                var fileSize = data.fileSize || 0;
                var releaseDate = data.releaseDate || '';

                versionText.textContent = 'v' + versionName;
                versionInfo.textContent = '版本：v' + versionName;

                if (description) {
                    descriptionContent.textContent = description;
                } else {
                    descriptionContent.innerHTML = '<span class="description-placeholder">暂无更新说明</span>';
                }

                if (fileSize > 0) {
                    fileSizeInfo.textContent = '文件大小：' + formatFileSize(fileSize);
                } else {
                    fileSizeInfo.textContent = '文件大小：--';
                }

                // Enable download button
                if (downloadUrl) {
                    var fullUrl = downloadUrl.startsWith('http') ? downloadUrl : window.location.origin + downloadUrl;
                    downloadBtn.disabled = false;
                    downloadBtnText.textContent = '下载 APK 安装包';

                    downloadBtn.onclick = function(e) {
                        e.preventDefault();
                        try {
                            window.location.href = fullUrl;
                        } catch (err) {
                            showToast('下载启动失败，请重试');
                        }
                    };
                } else {
                    downloadBtnText.textContent = '暂无可用下载';
                }

                // Update document title
                document.title = '魔力淘 App v' + versionName + ' 下载';
            }

            function showError(msg) {
                versionText.textContent = '获取失败';
                descriptionContent.innerHTML = '<span style="color:#e74c3c;">' + msg + '</span>';
                downloadBtnText.textContent = '暂无可用下载';
                fileSizeInfo.textContent = '文件大小：--';
                versionInfo.textContent = '版本：--';
            }

            // Start loading
            getVersionData();
        })();
    </script>
</body>
</html>
