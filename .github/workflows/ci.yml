name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_VERSION: '8.0.x'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  backend-build:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SonarCloud

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore backend/Molitao.sln

    - name: Build
      run: dotnet build backend/Molitao.sln --configuration Release --no-restore

    - name: Test with coverage
      run: |
        dotnet test backend/Molitao.sln \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          /p:Threshold=50 \
          /p:ExcludeByAttribute="ObsoleteAttribute" \
          /p:IncludeTestAssembly=false

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: success() || failure()
      with:
        files: ${{ github.workspace }}/**/coverage.cobertura.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
        verbose: true

    - name: SonarCloud Scan
      uses: sonarsource/sonarcloud-github-action@master
      if: github.event_name == 'pull_request'
      with:
        projectBaseDir: backend
        args: >
          /d:sonar.token=${{ secrets.SONAR_TOKEN }}
          /d:sonar.host.url=https://sonarcloud.io
          /d:sonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          /d:sonar.projectKey=your-project-key
          /d:sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
          /d:sonar.coverage.jacoco.xmlReportsPaths=**/coverage.cobertura.xml
          /d:sonar.sources=src
          /d:sonar.tests=**.
          /d:sonar.test.inclusions="**/*Tests.cs,**/*Test.cs"
          /d:sonar.cs.xunit.reportsPaths=**/TestResults/**/*.trx

  pc-build:
    name: PC Web (Vue 3)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: pc/package-lock.json
    
    - name: Install dependencies
      working-directory: ./pc
      run: npm ci
    
    - name: Run lint
      working-directory: ./pc
      run: npm run lint:fix
      continue-on-error: true
    
    - name: Build
      working-directory: ./pc
      run: npm run build:prod
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pc-dist
        path: pc/dist/
        retention-days: 7

  uniapp-build:
    name: UniApp (小程序)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: molitao_uniapp/package-lock.json
    
    - name: Install dependencies
      working-directory: ./molitao_uniapp
      run: npm ci
    
    - name: Type check
      working-directory: ./molitao_uniapp
      run: npm run type-check
      continue-on-error: true
    
    - name: Run lint
      working-directory: ./molitao_uniapp
      run: npm run lint:fix
      continue-on-error: true
    
    - name: Build WeChat Mini Program
      working-directory: ./molitao_uniapp
      run: npm run build:mp-weixin
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: uniapp-mp-weixin
        path: molitao_uniapp/dist/build/mp-weixin/
        retention-days: 7